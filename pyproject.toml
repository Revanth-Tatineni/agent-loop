[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-loop"
version = "0.1.0"
description = "A hand-rolled ReAct agent loop with MCP-exposed tools, guardrails, and a replayable JSON trace log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Revanth Tatineni" }]
keywords = ["agent", "react", "mcp", "llm", "agentic-ai", "anthropic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # llmtrace isn't on PyPI yet. This points at its eventual GitHub home; CI here can only
    # pass once llmtrace is pushed there -- publish llmtrace before agent-loop, not the other
    # way around. [tool.uv.sources] below overrides this to the local sibling checkout for
    # development right now.
    "llmtrace @ git+https://github.com/Revanth-Tatineni/llmtrace.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
agent-loop = "agent_loop.cli:main"

[project.urls]
Homepage = "https://github.com/Revanth-Tatineni/agent-loop"
Repository = "https://github.com/Revanth-Tatineni/agent-loop"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_loop"]

# Required because the llmtrace dependency above is a direct git-URL reference (llmtrace
# isn't on PyPI yet).
[tool.hatch.metadata]
allow-direct-references = true

# llmtrace isn't published to PyPI yet (see docs/explained in that repo). This redirects the
# dependency to the sibling checkout for local development only; once llmtrace is on PyPI,
# this whole [tool.uv.sources] block goes away and `llmtrace>=0.1.0` above resolves normally.
[tool.uv.sources]
llmtrace = { path = "../llmtrace" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/agent_loop"]
